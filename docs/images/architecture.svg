<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540" role="img" aria-label="Архитектура odata1c-gate: сессии Claude Code через лаунчеры обращаются к единственному демону; в демоне гейт делит поток на токены со стороны модели и реальные значения со стороны 1С; владелец настраивает шлюз и раскрывает токены из своего терминала, а хук не пускает модель к файлам шлюза.">
  <style>
    .bg { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .zone { fill: none; stroke: #8c959f; stroke-width: 1.2; }
    .gate { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.8; }
    .t { fill: #1f2328; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .h { fill: #1f2328; font: 600 13.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .s { fill: #59636e; font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .a { fill: #0969da; font: 600 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ln { stroke: #59636e; stroke-width: 1.4; fill: none; }
    .ah { fill: #59636e; }
    .edge { stroke: #0969da; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .deny { stroke: #cf222e; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    .dn { fill: #cf222e; font: 600 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #3d444d; }
      .box { fill: #161b22; stroke: #6e7681; }
      .zone { stroke: #6e7681; }
      .gate { fill: #0c2d4d; stroke: #4493f8; }
      .t, .h { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .a { fill: #4493f8; }
      .ln { stroke: #9198a1; }
      .ah { fill: #9198a1; }
      .edge { stroke: #4493f8; }
      .deny { stroke: #f85149; }
      .dn { fill: #f85149; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <!-- Собственный фон: цвета картинки переключаются по теме ОС, а страница — по теме сайта;
       с подложкой картинка читается в любом их сочетании. -->
  <rect class="bg" x="0.5" y="0.5" width="1019" height="539" rx="12"/>

  <!-- Claude Code: сессии -->
  <rect class="box" x="28" y="98" width="180" height="140" rx="8"/>
  <rect class="box" x="20" y="90" width="180" height="140" rx="8"/>
  <text class="h" x="110" y="118" text-anchor="middle">Claude Code</text>
  <text class="s" x="110" y="136" text-anchor="middle">сессии 1…N</text>
  <line class="zone" x1="36" y1="150" x2="184" y2="150"/>
  <text class="t" x="110" y="172" text-anchor="middle">плагин odata1c:</text>
  <text class="s" x="110" y="190" text-anchor="middle">навыки · агент</text>
  <text class="s" x="110" y="206" text-anchor="middle">хук PreToolUse</text>

  <!-- Лаунчер -->
  <rect class="box" x="248" y="118" width="140" height="100" rx="8"/>
  <rect class="box" x="240" y="110" width="140" height="100" rx="8"/>
  <text class="h" x="310" y="140" text-anchor="middle">лаунчер</text>
  <text class="t" x="310" y="160" text-anchor="middle">odata1c mcp</text>
  <text class="s" x="310" y="180" text-anchor="middle">один на сессию,</text>
  <text class="s" x="310" y="195" text-anchor="middle">без своей логики</text>

  <line class="ln" x1="200" y1="160" x2="238" y2="160" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="s" x="219" y="152" text-anchor="middle">stdio</text>

  <!-- Демон -->
  <rect class="zone" x="440" y="40" width="420" height="335" rx="10"/>
  <text class="h" x="650" y="64" text-anchor="middle">демон · odata1c daemon</text>
  <text class="s" x="650" y="82" text-anchor="middle">один на машину · 127.0.0.1:7171</text>

  <line class="ln" x1="388" y1="160" x2="458" y2="160" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="s" x="421" y="152" text-anchor="middle">MCP · HTTP</text>

  <!-- граница псевдонимизации -->
  <line class="edge" x1="660" y1="94" x2="660" y2="238"/>
  <text class="a" x="648" y="104" text-anchor="end">модель видит токены</text>
  <text class="a" x="672" y="104">реальные значения</text>

  <!-- Тулы -->
  <rect class="box" x="460" y="115" width="115" height="90" rx="8"/>
  <text class="h" x="517" y="142" text-anchor="middle">тулы MCP</text>
  <text class="s" x="517" y="162" text-anchor="middle">чтение</text>
  <text class="s" x="517" y="177" text-anchor="middle">запись</text>
  <text class="s" x="517" y="192" text-anchor="middle">рецепты</text>

  <!-- Гейт -->
  <rect class="gate" x="600" y="115" width="120" height="90" rx="8"/>
  <text class="h" x="660" y="140" text-anchor="middle">гейт</text>
  <text class="s" x="660" y="158" text-anchor="middle">токен → значение</text>
  <text class="s" x="660" y="173" text-anchor="middle">значение → токен</text>
  <text class="s" x="660" y="188" text-anchor="middle">страж утечек</text>

  <line class="ln" x1="575" y1="160" x2="598" y2="160" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Клиент 1С -->
  <rect class="box" x="745" y="115" width="95" height="90" rx="8"/>
  <text class="h" x="792" y="146" text-anchor="middle">клиент 1С</text>
  <text class="s" x="792" y="166" text-anchor="middle">пул соединений</text>
  <text class="s" x="792" y="181" text-anchor="middle">на базу</text>

  <line class="ln" x1="720" y1="160" x2="743" y2="160" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Индекс и словарь -->
  <rect class="box" x="460" y="245" width="115" height="56" rx="8"/>
  <text class="h" x="517" y="268" text-anchor="middle">индекс</text>
  <text class="s" x="517" y="286" text-anchor="middle">сущности и поля</text>
  <line class="ln" x1="517" y1="205" x2="517" y2="243" marker-end="url(#arr)"/>

  <rect class="box" x="600" y="245" width="120" height="56" rx="8"/>
  <text class="h" x="660" y="268" text-anchor="middle">словарь</text>
  <text class="s" x="660" y="286" text-anchor="middle">значение ↔ токен</text>
  <line class="ln" x1="660" y1="205" x2="660" y2="243" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Протокол записи -->
  <rect class="box" x="460" y="320" width="380" height="38" rx="8"/>
  <text class="t" x="650" y="344" text-anchor="middle">запись: превью → подтверждение человеком → журнал → откат</text>

  <!-- 1С -->
  <path class="box" d="M903,128 v84 a50,11 0 0 0 100,0 v-84"/>
  <ellipse class="box" cx="953" cy="128" rx="50" ry="11"/>
  <path class="box" d="M895,120 v84 a50,11 0 0 0 100,0 v-84"/>
  <ellipse class="box" cx="945" cy="120" rx="50" ry="11"/>
  <text class="h" x="945" y="160" text-anchor="middle">1С</text>
  <text class="s" x="945" y="178" text-anchor="middle">OData</text>
  <text class="s" x="945" y="193" text-anchor="middle">базы 1…N</text>

  <line class="ln" x1="840" y1="160" x2="893" y2="160" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="s" x="866" y="152" text-anchor="middle">HTTPS</text>

  <!-- Владелец -->
  <rect class="box" x="20" y="430" width="240" height="84" rx="8"/>
  <text class="h" x="140" y="456" text-anchor="middle">терминал владельца</text>
  <text class="s" x="140" y="476" text-anchor="middle">odata1c base add · reindex</text>
  <text class="s" x="140" y="492" text-anchor="middle">policy · reveal · doctor</text>

  <!-- Домашний каталог -->
  <rect class="box" x="440" y="430" width="420" height="84" rx="8"/>
  <text class="h" x="650" y="456" text-anchor="middle">домашний каталог ~/.claude/odata1c</text>
  <text class="s" x="650" y="476" text-anchor="middle">bases.yaml (пароли 1С) · policy.yaml · gate/*.yaml</text>
  <text class="s" x="650" y="492" text-anchor="middle">индекс, словарь, журнал · launcher.key</text>

  <line class="ln" x1="260" y1="472" x2="438" y2="472" marker-end="url(#arr)"/>
  <text class="s" x="349" y="464" text-anchor="middle">настраивает, раскрывает</text>
  <text class="s" x="349" y="489" text-anchor="middle">токены — мимо модели</text>

  <line class="ln" x1="560" y1="428" x2="560" y2="377" marker-end="url(#arr)"/>
  <text class="s" x="568" y="408">читает настройки</text>

  <!-- Хук -->
  <line class="deny" x1="150" y1="238" x2="438" y2="440"/>
  <text class="dn" x="286" y="338" text-anchor="middle">✕</text>
  <text class="dn" x="272" y="352" text-anchor="end">хук: модели доступ</text>
  <text class="dn" x="272" y="367" text-anchor="end">к файлам закрыт</text>
</svg>
