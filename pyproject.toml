[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odata1c-gate"
dynamic = ["version"]
description = "Локальный MCP-шлюз к OData 1С:Предприятие с гейтом псевдонимизации"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Roman Danilov" }]
dependencies = [
    # Нижняя граница по факту пробы P1: SDK вышел в мажорной версии 2 (docs/probes/P1-wheels-windows.md).
    "mcp>=2.2",
    "httpx>=0.27",
    # Клиент лаунчера (odata1c mcp) — streamable_http_client требует httpx2, не httpx (SPEC §2.2,
    # план M1d задача 6). Уже приходит транзитивно через mcp, но лаунчер обращается к нему
    # напрямую — прямая зависимость честнее транзитивной.
    "httpx2>=2.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Обратимый разбор YAML для конструктора политики (ADR-0015): запись правила владельца в
    # policy.yaml с сохранением его комментариев (strip_auto_section — первый потребитель).
    "ruamel.yaml>=0.18",
    "lxml>=5.2",
    "snowballstemmer>=2.2",
    "ahocorasick-rs>=0.22",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Romandredan/odata1c-gate"
Repository = "https://github.com/Romandredan/odata1c-gate"

[project.optional-dependencies]
keyring = ["keyring>=25.0"]

[project.scripts]
odata1c = "odata1c.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.hatch.version]
path = "src/odata1c/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odata1c"]

[tool.hatch.build.targets.sdist]
# Только исходники и документы поставки: рабочие копии агентов (.claude/worktrees), журналы SDD,
# полные дампы $metadata и результаты evals в архив не попадают (итоговое ревью M3, M-2).
only-include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["tests/fixtures/edmx/*.full.edmx", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
# tools/ — обычные скрипты, не пакет в составе дистрибутива; путь только для тестов,
# которые импортируют tools.bump_version и tools.plugin_dev_copy напрямую (Задача 1 M3).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tools/probes", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
