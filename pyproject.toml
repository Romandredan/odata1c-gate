[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odata1c"
dynamic = ["version"]
description = "Локальный MCP-шлюз к OData 1С:Предприятие с гейтом псевдонимизации"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Roman Danilov" }]
dependencies = [
    # Нижняя граница по факту пробы P1: SDK вышел в мажорной версии 2 (docs/probes/P1-wheels-windows.md).
    "mcp>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "lxml>=5.2",
    "snowballstemmer>=2.2",
    "ahocorasick-rs>=0.22",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
keyring = ["keyring>=25.0"]

[project.scripts]
odata1c = "odata1c.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[tool.hatch.version]
path = "src/odata1c/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/odata1c"]

[tool.hatch.build.targets.sdist]
exclude = ["tools/probes", "docs/probes", "tests/fixtures/edmx/*.full.edmx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tools/probes", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
