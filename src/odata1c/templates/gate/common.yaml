# odata1c: каталог правил сущностей (ADR-0016) — платформа и общие библиотеки (БСП, БЭД, БГосИС).
#
# Формат одинаков у всех файлов каталога — поставки (odata1c/templates/gate/) и владельца
# (~/.claude/odata1c/gate/, правила доработанных конфигураций). Все разделы необязательны.
#   people         справочники людей: Description и поля ФИО — person, адрес — адрес физлица
#   orgs           справочники организаций: Description и наименования — org
#   addr_mask_for  сущности не-справочники, чьи адреса принадлежат физлицам
#   fields         Сущность.Поле: класс — правило одной сущности (для регистра действует и на его
#                  набор записей и виртуальные таблицы)
#   names          ИмяПоля: класс — поле с таким именем в любой сущности (регистр букв не важен)
# Класс — любой класс гейта, кроме keep, или scan: «по имени не классифицировать» (реквизиты в
# значении ищут детекторы, как в любом тексте) — так снимается ложное срабатывание общего правила.
# Правило действует на любой базе, в индексе которой есть его сущность; после правки — реиндекс.
version: 1
about: платформа и общие библиотеки

people:
  - Catalog_ФизическиеЛица
  - Catalog_Пользователи
  - Catalog_КонтактныеЛица
  - Catalog_ПодписантыОрганизацийЕИС
  - Catalog_ПодписантыСервисаМобильнойПодписи
  - Catalog_ПользователиВЕТИС
  - Catalog_СертификатыКлючейЭлектроннойПодписиИШифрования
  - Catalog_УдалитьСертификатыЭП

orgs:
  - Catalog_Контрагенты
  - Catalog_Организации

names:
  # Член перечисления «ЮрЛицо»/«ФизЛицо», а не ФИО: без правила подстрока «физлицо» давала
  # person, и модель теряла признак, по которому организация отличается от ИП (находка П1).
  ЮрФизЛицо: scan
  # Должность и решение, а не имя (проект M3b §3.4): подстрока «руководител» законно метит ФИО
  # в ФИОРуководителяКонтрагента, поэтому исключение — полным именем поля.
  ДолжностьРуководителя: scan
  РешениеРуководителя: scan
  # Имя человека в поле, чьё имя начинается с «Имя»: с него же начинаются сотни служебных полей
  # (ИмяФайла, ИмяСервера), поэтому общего правила нет — только поля, сверенные по дампам УТ и БП.
  # Первые восемь стоят в паре с «Фамилия…» той же сущности (сторож — тест на дампах).
  ИмяВСвидетельстве: person
  ИмяЗаявителя: person
  ИмяИП: person
  # ФИО предпринимателя в справочнике организаций — ФИО, а не название (слой 1 дал бы org).
  ФамилияИП: person
  ОтчествоИП: person
  ИмяОтправителя: person
  ИмяПолучателя: person
  ИмяПолучателяДокументов: person
  ИмяРебенка: person
  ИмяУмершего: person
  ИмяГостя: person
  ИмяДержателяКарты: person
  # Название контрагента из банковской выписки (документы движения безналичных денег УТ).
  ИмяКонтрагента: org
  # Сетевые адреса сервисов, серверов и файлов: правило адреса (^адрес) метило их почтовым
  # адресом. scan — не адрес, но реквизиты (почту, телефон) в значении ищут детекторы. Только
  # однозначно сетевые имена: общее имя (АдресПолучателя) у документа о физлице бывает и
  # почтовым адресом, и scan открыл бы его там, где адрес закрыт.
  АдресАвторизации: scan
  АдресВебСервиса: scan
  АдресЕСИА: scan
  АдресИзображения: scan
  АдресИнтернетМагазина: scan
  АдресЛичногоКабинета: scan
  АдресПеренаправления: scan
  АдресПеренаправленияВебКлиент: scan
  АдресПиктограммы: scan
  АдресПодключения: scan
  АдресПодключенияЛМ: scan
  АдресПолученияКлюча: scan
  АдресПриложения: scan
  АдресПриложенияПоИмени: scan
  АдресРезультата: scan
  АдресРесурса: scan
  АдресРесурсаКонтрагента: scan
  АдресРесурсаОрганизации: scan
  АдресСайта: scan
  АдресСайтаПроверки: scan
  АдресСервера: scan
  АдресСервераЗапросаРазрешения: scan
  АдресСервиса: scan
  АдресСервисаАвторизации: scan
  АдресСпискаОтзыва: scan
  АдресТаблицыСоответствий: scan
  АдресУЦ: scan
  АдресУТМ: scan
  АдресУзлаГИСМТ: scan
  АдресФайлаВыгрузкиРСВ: scan
  АдресХостаВнешнихНавигационныхСсылок: scan
  АдресЧекаНаСайте: scan
