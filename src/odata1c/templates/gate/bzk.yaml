  Document_ЗапросНаИнформационноеОбслуживаниеСтрахователя_ЗастрахованныеЛица.СтраховойНомер: snils
  # Заявление о назначении пенсии: документ заявителя и представителя, счёт для перечисления,
  # адрес доставки, ответ на контрольный вопрос ПФР (класс doc — закрыт целиком одним токеном).
  Catalog_ЗаявлениеОНазначенииПенсии.СерияНомер: doc
  Catalog_ЗаявлениеОНазначенииПенсии.ПредставительСерия: doc
  Catalog_ЗаявлениеОНазначенииПенсии.ПредставительНомер: doc
