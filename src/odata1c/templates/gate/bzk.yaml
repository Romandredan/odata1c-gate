  Document_СведенияОРаботникахДляМедРегистра_ПослевузовскоеОбразование.Номер: doc
  Document_СведенияОРаботникахДляМедРегистра_Сертификаты.Номер: doc
  Document_СведенияОРаботникахДляМедРегистра_УдалитьОбразованиеФизическихЛиц.Номер: doc
  InformationRegister_СертификатыПоСпециальностиФизическихЛиц.Номер: doc
  InformationRegister_СпециальностиФизическихЛиц.Номер: doc
  # Контактная информация застрахованных ДМС (адрес закрыт через addr_mask_for выше).
  InformationRegister_ОтправленнаяКонтактнаяИнформацияЗастрахованных.Представление: addr
  InformationRegister_УдалитьОтправленнаяКонтактнаяИнформацияЗастрахованных.Представление: addr
  # СНИЛС в запросе СФР об информационном обслуживании страхователя: общее имя поля, по имени
