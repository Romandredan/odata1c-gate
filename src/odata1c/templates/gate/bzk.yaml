# odata1c: каталог правил сущностей (ADR-0016) — Библиотека зарплаты и кадров (БП, ЗУП, частично
# УТ). Формат — шапка common.yaml рядом. Сверено с полными $metadata УТ 11 и БП 3.0 (2026-09-24,
# docs/probes/BP-recon.md) и ЗУП КОРП 3.1 (2026-09-28, docs/probes/ZUP-recon.md).
version: 1
about: зарплата и кадры

people:
  - Catalog_Сотрудники
  - Catalog_РодственникиФизическихЛиц
  # ЗУП: анкета кандидата (ФИО, место рождения) и собеседник чат-бота кабинета сотрудника.
  - Catalog_ЛичныеДанныеКандидатов
  - Catalog_СобеседникиЧатботов
  # Кандидат: Description — ФИО (как у физлица, с УточнениеНаименования), ссылка на анкету —
  # ЛичныеДанные_Key. Признаков человека в полях нет, сторож Ruling 36 его не находит (ревью
  # атакующим, находка 6); в zup_test кандидатов нет — по устройству ЗУП, не по данным.
  - Catalog_Кандидаты

# Документы и регистры о работниках, чьи адреса — адреса физлиц (адрес получателя пособия,
# адрес для информирования по зарплатной карте, адрес субъекта согласия на обработку ПДн).
# Адреса проживания и регистрации закрыты правилом по имени поля в любой сущности.
addr_mask_for:
  - Document_ЗаявлениеСотрудникаНаВыплатуПособия
  - Document_ЗаявкаНаОткрытиеЛицевыхСчетовСотрудников
  - InformationRegister_ОтложенноеОткрытиеЛицевыхСчетовСотрудников
  - Document_СогласиеНаОбработкуПерсональныхДанных
  - Catalog_ЗаявлениеОНазначенииПенсии
  # ЗУП: телефоны, почта и адреса застрахованных, отправленные страховщику ДМС, — одной строкой
  # `Представление` без поля типа (правило контактной информации Ruling 33 её не видит).
  - InformationRegister_ОтправленнаяКонтактнаяИнформацияЗастрахованных
  - InformationRegister_УдалитьОтправленнаяКонтактнаяИнформацияЗастрахованных
  # Ревью атакующим (находка 2): адрес работника в согласии на уведомление об ЭЛН, очевидца
  # несчастного случая, родственника в загрузке данных для ДМС, получателя по исполнительному
  # листу (алименты — обычно физлицо; получатель-организация закрывается лишне, а не открыто).
  - Document_СогласиеНаУведомлениеОбЭЛН
  - Document_НесчастныйСлучайНаПроизводстве_Очевидцы
  - Document_ПрикреплениеКПрограммамМедицинскогоСтрахования_ЗагрузкаИзФайлаПерсональныхДанныхРодственников
  - Document_ИсполнительныйЛист
  # Адрес работника под общим именем поля (Адрес, АдресФактический, АдресДляИнформирования,
  # СотрудникАдрес, АдресРФ) в справках НДФЛ, сведениях о доходах, пачках АДВ, ДСВ-1, СЗВ-6 и
  # запросах СФР (БП и ЗУП; живая приёмка ЗУП 2026-09-28: адрес справки НДФЛ уходил открытым).
  # Там, где в том же документе лежит и адрес организации, он закрывается тоже — лишнее
  # закрытие, а не открытие.
  - Document_СправкаНДФЛ
  - Document_СправкиНДФЛДляПередачиВНалоговыйОрган_Сотрудники
  - Document_СправкиПоНДФЛДляРасчетаПоНалогуНаПрибыль_Сотрудники
  - Document_СведенияОДоходахСотрудникаДляСоцВыплат
  - Document_ПачкаДокументовАДВ_1_Сотрудники
  - Document_ПачкаДокументовАДВ_2_Сотрудники
  - Document_ПачкаДокументовАДВ_3_Сотрудники
  - Document_ПачкаДокументовДСВ_1_Сотрудники
  - Document_ПачкаДокументовСЗВ_6_1_Сотрудники
  - Document_РеестрСЗВ_6_2_Сотрудники
  - Document_ЗапросСреднегоЗаработкаСЭДО
  - Document_ЗаявлениеИЗапросВПФРОЗаработке
  - Document_ЗапросВФССОПроверкеРаботодателя
  - Document_СведенияДляФРМР_Работники
  - Document_УдалитьЗаявлениеОбОбменеДубликатеСтраховогоСвидетельства_РаботникиОрганизации
  - Document_УдалитьПередачаДСВвПФР_РаботникиОрганизации
  - Document_УдалитьАнкетаЗастрахованногоЛица_РаботникиОрганизации
  - Document_УдалитьСведенияОТрудовомСтажеИЗаработкеСЗВ4_РаботникиОрганизации
  - Document_УдалитьСправкаПоНДФЛВНалоговыйОрган_СотрудникиОрганизации
  - Document_УдалитьСправкаПоНДФЛВНалоговыйОрганС2015_СотрудникиОрганизации
  - Document_УдалитьСправкаПоНДФЛСотруднику
  - Document_УдалитьСправкаПоНДФЛСотрудникуС2015

fields:
  # Документ, удостоверяющий личность: номер — только в этом регистре (общее правило ^номер$
  # закрыло бы номера всех документов, инвариант 6); представление несёт серию и номер целиком.
  InformationRegister_ДокументыФизическихЛиц.Номер: doc
  InformationRegister_ДокументыФизическихЛиц.Представление: doc
  InformationRegister_СведенияОбИнвалидностиФизическихЛиц.СерияСправки: doc
  InformationRegister_СведенияОбИнвалидностиФизическихЛиц.НомерСправки: doc
  InformationRegister_ВоинскийУчет.СерияУдостоверенияОбОтсрочке: doc
  InformationRegister_ВоинскийУчет.НомерУдостоверенияОбОтсрочке: doc
  # Паспорт работника в справках НДФЛ, пачках АДВ, справках о заработке и заявлениях (БП и ЗУП,
