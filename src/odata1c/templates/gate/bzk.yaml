  Document_ЗаявлениеОПодтвержденииПраваНаЗачетАвансовПоНДФЛ_Сотрудники.НомерДокумента: doc
  Document_ИсходящаяСправкаОЗаработкеДляРасчетаПособий.НомерДокумента: doc
  Document_ОтпускПоУходуЗаРебенком_ДанныеОДетях.НомерДокумента: doc
  Document_ПачкаДокументовАДВ_1_Сотрудники.НомерДокумента: doc
  Document_ПачкаДокументовАДВ_2_Сотрудники.НомерДокумента: doc
  Document_ПачкаДокументовАДВ_3_Сотрудники.НомерДокумента: doc
  Document_РеестрСведенийНеобходимыхДляНазначенияИВыплатыПособий_СведенияНеобходимыеДляНазначенияПособий.НомерДокумента: doc
  Document_РезультатыАттестацииСотрудников_РезультатыАттестации.НомерДокумента: doc
  Document_СведенияОДоходахСотрудникаДляСоцВыплат.НомерДокумента: doc
  Document_СправкаНДФЛ.НомерДокумента: doc
  Document_СправкиНДФЛДляПередачиВНалоговыйОрган_Сотрудники.НомерДокумента: doc
  Document_СправкиПоНДФЛДляРасчетаПоНалогуНаПрибыль_Сотрудники.НомерДокумента: doc
  Document_УдалитьЗаявлениеОПодтвержденииПраваНаЗачетАвансовПоНДФЛ_РаботникиОрганизации.НомерДокумента: doc
  Document_УдалитьСправкаПоНДФЛВНалоговыйОрган_СотрудникиОрганизации.НомерДокумента: doc
  Document_УдалитьСправкаПоНДФЛВНалоговыйОрганС2015_СотрудникиОрганизации.НомерДокумента: doc
  Document_УдалитьСправкаПоНДФЛСотруднику.НомерДокумента: doc
  Document_УдалитьСправкаПоНДФЛСотрудникуС2015.НомерДокумента: doc
  # Документы человека в паре Серия (класс doc по общему правилу) + Номер: удостоверение личности
