  Catalog_РодственникиФизическихЛиц.НаименованиеСлужебное: person
  Catalog_ЛичныеДанныеКандидатов.НаименованиеСлужебное: person
  # Справка об инвалидности ребёнка в заявлении о возмещении выплат родителям детей-инвалидов;
  # свидетельство об аккредитации специалиста (аналог сертификата по специальности).
