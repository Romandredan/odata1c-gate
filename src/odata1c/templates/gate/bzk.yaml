  Catalog_ОбразованиеФизическихЛиц.Номер: doc
  Document_СведенияДляФРМР_ДокументыУдостоверяющиеЛичность.Номер: doc
  Document_СведенияДляФРМР_Сертификаты.Номер: doc
  Document_СведенияОРаботникахДляМедРегистра_Образование.Номер: doc
  Document_СведенияОРаботникахДляМедРегистра_Переподготовка.Номер: doc
