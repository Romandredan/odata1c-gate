# Рецепты для типовой конфигурации «Зарплата и управление персоналом» (SPEC §8).
#
# Пока пусто: нет базы ЗУП, на которой можно сверить имена регистров, виртуальных таблиц и полей,
# а рецепт с невыверенными именами хуже отсутствия рецепта — он даёт модели уверенную подсказку,
# по которой база отвечает «сущность не найдена». Заполняется, когда появится база для проверки:
# образец разметки — ut.yaml рядом.
#
# Отдельно для ЗУП: почти все выборки здесь идут по физическим лицам, то есть по данным, которые
# гейт защищает на уровне `identifiers+names` (ФИО, СНИЛС, паспорта). Рецепты должны отдавать
# ссылки и суммы, а отбор по человеку принимать токеном — открытых ФИО в условиях быть не должно.
